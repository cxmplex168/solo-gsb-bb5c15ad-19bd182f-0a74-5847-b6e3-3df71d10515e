services:
  api:
    build: .
    image: dna-restriction-digest
    ports:
      - "8000:8000"          # 宿主机端口:容器端口，左侧可改
    environment:
      APP_DB_PATH: /data/digest.db   # SQLite 数据库文件路径
      APP_PORT: "8000"               # 容器内监听端口
    volumes:
      - digest-data:/data            # 持久化 SQLite 数据
    restart: unless-stopped

volumes:
  digest-data:
